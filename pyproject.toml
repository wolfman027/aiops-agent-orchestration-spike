[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidiag"
version = "0.1.0"
description = "AiOps 只读诊断 spike — AgentScope 复刻 HolmesGPT 诊断核心"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # 智能体运行时：与 agentflow 锁定一致
    "agentscope==2.0.3",
    # AgentScope 2.0.3 的 MCP 包装按 mcp SDK v1 API 编写（MCPTool 读 camelCase inputSchema/
    # readOnlyHint），mcp 2.x 改 snake_case 会破坏只读自动放行 → 显式 pin <2（与 agentflow 同款）。
    "mcp>=1.13,<2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # DeepSeek（OpenAI 兼容）经 AgentScope OpenAI 模型接入
    "openai>=1.60",
    # 提示词模板
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["aidiag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: 需要真实 DeepSeek 的端到端诊断测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
